<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@@title</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="@@description" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="author" content="Tugam Cattle & Game Farm" />

    <!-- Canonical URL -->
    <link rel="canonical" href="@@canonical" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="@@title" />
    <meta property="og:description" content="@@description" />
    <meta property="og:image" content="@@og_image" />
    <meta property="og:url" content="@@canonical" />
    <meta property="og:site_name" content="Tugam Cattle & Game Farm" />
    <meta property="og:locale" content="en_ZA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="@@title" />
    <meta name="twitter:description" content="@@description" />
    <meta name="twitter:image" content="@@og_image" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Tugam Cattle & Game Farm",
      "description": "Family-owned game farm in Pongola, KwaZulu-Natal offering accommodation, venue hire, Ankole cattle experiences and guided hunting.",
      "url": "https://tugamgamefarm.co.za",
      "logo": "https://tugamgamefarm.co.za/images/logo.png",
      "image": "https://tugamgamefarm.co.za/images/slider-main/accommodation.png",
      "telephone": "+27664952114",
      "email": "bookings@tugamgamefarm.co.za",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Lot 10, R69",
        "addressLocality": "Pongola",
        "postalCode": "3170",
        "addressCountry": "ZA"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": -27.5666,
        "longitude": 31.6681
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "07:00",
        "closes": "20:00"
      },
      "priceRange": "R300 - R1500",
      "currenciesAccepted": "ZAR",
      "paymentAccepted": "Cash, EFT",
      "areaServed": "Pongola, KwaZulu-Natal, South Africa",
      "sameAs": []
    }
    </script>

    <!-- Preconnect for faster external resources -->
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="stylesheet" href="plugins/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW37qh2ZmFP1gAPSFiKdoV5bkc2/AuEBJsAcSL0M3q0AhkBO1GiZLiqkFtjFOa4ga34cg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="plugins/slick/slick.css" />
    <link rel="stylesheet" href="plugins/slick/slick-theme.css" />
    <link rel="stylesheet" href="css/style.css" />

    <style>
      /* Address link styling */
      .info-text a {
        text-decoration: none;
        color: inherit;
        display: flex;
        align-items: center;
        transition: color 0.3s ease-in-out;
      }

      .info-text a i {
        margin-right: 8px;
        transition: color 0.3s ease-in-out;
      }

      .info-text a:hover,
      .info-text a:hover i {
        color: #305d26;
      }

      /* Social links hidden until client provides URLs */
      .social-links-placeholder {
        display: none !important;
      }

      /* Skip link: visible on focus for keyboard/screen reader users */
      .skip-link {
        position: absolute;
        left: -9999px;
        z-index: 10001;
        padding: 12px 20px;
        background: #305d26;
        color: #fff !important;
        font-weight: 600;
        border-radius: 0 0 4px 0;
        text-decoration: none;
      }
      .skip-link:focus {
        left: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="body-inner">
      <div id="top-bar" class="top-bar">
        <div class="container">
          <div class="row">
            <div class="col-lg-8 col-md-8">
              <ul class="top-info text-center text-md-left">
                <li>
                  <p class="info-text">
                    <a
                      href="https://maps.app.goo.gl/aZgkyoaHwXeqguXk8"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      <i class="fas fa-map-marker-alt"></i>
                      Lot 10, R69, Pongola, 3170, South Africa
                    </a>
                  </p>
                </li>
              </ul>
            </div>

            <div class="col-lg-4 col-md-4 top-social text-center text-md-right social-links-placeholder">
              <ul class="list-unstyled">
                <li>
                  <a
                    title="Facebook"
                    href="https://www.facebook.com/"
                  >
                    <span class="social-icon"
                      ><i class="fab fa-facebook-f"></i
                    ></span>
                  </a>
                  <a
                    title="Instagram"
                    href="https://www.instagram.com/"
                  >
                    <span class="social-icon"
                      ><i class="fab fa-instagram"></i
                    ></span>
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
